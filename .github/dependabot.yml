version: 2
# Version updates target `dev` (see target-branch below). Dependabot
# security updates always open against the repository default branch
# (`main`) and ignore target-branch; GitHub does not allow pointing
# security-update PRs at a non-default branch. Vulnerable glob / minimatch
# copies are pinned on dev via pnpm.overrides and will reach main with
# the next release PR.
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      typescript-eslint:
        patterns: ["typescript-eslint", "@eslint/*", "eslint", "eslint-*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
        # Keep major bumps ungrouped noise low — open separately
        update-types: ["minor", "patch"]
      tanstack-query:
        patterns: ["@tanstack/query-*", "@tanstack/react-query*"]
      turbo:
        patterns: ["turbo"]
      expo:
        patterns: ["expo", "expo-*", "@expo/*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      # The Expo SDK line moves as one unit (`npx expo install --fix`), never
      # package by package: a lone major bump of an expo-* package pulls an
      # SDK 55 release into this SDK 54 app and breaks the native build
      # (KC#1276). The weekly majors for expo-image, expo-dev-client,
      # expo-status-bar, expo-system-ui and babel-preset-expo all failed CI.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 8

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
