version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      typescript-eslint:
        patterns: ["typescript-eslint", "@eslint/*", "eslint", "eslint-*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
        # Keep major bumps ungrouped noise low — open separately
        update-types: ["minor", "patch"]
      tanstack-query:
        patterns: ["@tanstack/query-*", "@tanstack/react-query*"]
      turbo:
        patterns: ["turbo"]
      expo:
        patterns: ["expo", "expo-*", "@expo/*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      # The Expo SDK line moves as one unit (`npx expo install --fix`), never
      # package by package: a lone major bump of an expo-* package pulls an
      # SDK 55 release into this SDK 54 app and breaks the native build
      # (KC#1276). The weekly majors for expo-image, expo-dev-client,
      # expo-status-bar, expo-system-ui and babel-preset-expo all failed CI.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      # react-native-purchases 11.x needs PurchasesHybridCommon 20.x, which is not
      # published on the CocoaPods trunk, so `pod install` fails and breaks every
      # iOS TestFlight build (run 42651822212, #1974). Stay on ^9 until the pod
      # ships; drop this ignore after a local `pod install --repo-update` passes.
      - dependency-name: "react-native-purchases"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 8

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
