name: Auto-merge PRs

# Enables squash auto-merge on every non-draft, same-repo PR whose base is not
# `main` (no label needed). Opt-outs: a draft PR, or a PR labelled
# `no-auto-merge`, for a PR that the merge queue must not squash (the main →
# dev sync lands as a merge commit; a squash would drop the ancestry it adds). GitHub then merges by
# itself once the dev ruleset is satisfied (`CI gate` green, via the merge queue).
# Never touches `main`. Docs: docs/agents/OPERATING_MODEL.md.
#
# Works from `dev` only (no change to `main` needed):
# 1. `request` runs on `pull_request` (the PR's own workflow copy, which is
#    based on dev). It holds NO secrets: it only dispatches this workflow on
#    `--ref dev` with the PR number (GITHUB_TOKEN may trigger workflow_dispatch).
# 2. `enable` runs on `workflow_dispatch` from `dev`'s copy, so the
#    `agent-merge` environment (deployment branch: dev only) releases the agent
#    GitHub App credentials. A PR branch can never read them: its own run has
#    no environment, and the dispatched run always executes dev's file.
# It re-checks the PR (open, not draft, same repo, base != main) before
# enabling auto-merge. GITHUB_TOKEN is never used for the merge: a merge made
# with it triggers no push CI and no deploy (TD-197). No PR code is checked out.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to arm auto-merge on
        required: true
        type: string

permissions: {}

jobs:
  request:
    name: request auto-merge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref != 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the enable job on dev
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh workflow run auto-merge-agent-ready.yml --repo "$REPO" --ref dev -f pr="$PR"

  enable-auto-merge:
    name: enable auto-merge (squash)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    concurrency:
      group: auto-merge-${{ inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent-merge
    permissions: {}
    steps:
      # Step `if:` cannot read secrets, so this step turns "are the App
      # credentials configured?" into an output.
      - name: Detect the agent App credentials
        id: identity
        env:
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      # Installation token scoped to this repository and to what enabling
      # auto-merge and deleting the head branch need. It expires within an
      # hour and the action revokes it when the job ends.
      - name: Mint agent GitHub App token
        id: app
        if: steps.identity.outputs.app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AGENT_MERGE_TOKEN }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        # No --delete-branch: GitHub rejects it while the `dev` merge queue is enabled
        # ("Cannot use -d or --delete-branch when merge queue enabled"); the queue's
        # merge removes the head branch per the repository's delete-on-merge setting.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No agent merge identity: set AGENT_APP_ID + AGENT_APP_PRIVATE_KEY (GitHub App, preferred) or AGENT_MERGE_TOKEN in the agent-merge environment (deployment branch dev). GITHUB_TOKEN is not used because a merge made with it triggers no push CI and no deploy (TD-197). See docs/SSOT/OPERATOR_RUNBOOK.md § Owner setup for D-195 CI/CD."
            exit 1
          fi
          case "$PR" in ''|*[!0-9]*) echo "::error::bad PR number"; exit 1;; esac
          # Re-checked here, not only in `request`: the label may be added after the dispatch.
          ok=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft,baseRefName,isCrossRepository,labels \
            --jq '.state=="OPEN" and (.isDraft|not) and .baseRefName!="main" and (.isCrossRepository|not) and ([.labels[].name] | index("no-auto-merge") | not)')
          if [ "$ok" != "true" ]; then echo "PR #$PR is not eligible; skipping."; exit 0; fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash
