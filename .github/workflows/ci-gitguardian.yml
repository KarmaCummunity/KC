# GitGuardian ggshield — secret leak scan on PR diffs.
# Requires repo/org secret GITGUARDIAN_API_KEY (GitGuardian dashboard → API).
# Fails closed: a missing/empty GITGUARDIAN_API_KEY is an error (it used to
# skip green), and any secret ggshield finds in the PR diff fails the check.
# Dependabot-triggered runs only see Dependabot secrets, so the key must exist
# there too. Not a required check yet: see SECURITY.md § Quality tooling.
# Complements GitHub Secret Scanning (push-time). See SECURITY.md § Quality tooling.

name: CI — GitGuardian

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-gitguardian-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitguardian:
    name: GitGuardian secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require GITGUARDIAN_API_KEY
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::GITGUARDIAN_API_KEY is missing or empty — the GitGuardian scan cannot run. Set the repo Actions secret (and the Dependabot secret) per SECURITY.md."
            exit 1
          fi

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
