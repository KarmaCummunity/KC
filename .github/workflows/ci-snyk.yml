# Snyk — dependency vulnerability scan on PRs to dev/main.
# Requires repo/org secret SNYK_TOKEN (https://app.snyk.io/account).
# Fails closed: a missing/empty SNYK_TOKEN is an error (it used to skip green,
# so the scan silently never ran). Fails on CRITICAL vulnerabilities only
# (high and below are reported by dependency-audit). Dependabot-triggered runs
# only see Dependabot secrets, so SNYK_TOKEN must exist there too.
# Not a required check yet: see SECURITY.md § Quality tooling.

name: CI — Snyk

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-snyk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk dependency scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is missing or empty — the Snyk scan cannot run. Set the repo Actions secret (and the Dependabot secret) per SECURITY.md."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Snyk test (app monorepo)
        working-directory: app
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: pnpm dlx snyk@1.1308.4 test --all-projects --severity-threshold=critical
