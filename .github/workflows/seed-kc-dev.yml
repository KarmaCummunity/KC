name: Seed KC dev

# Manual only. Loads the versioned seeds into the KC dev Supabase project (kc-dev) over a
# direct Postgres connection (the loaders use \copy). Never targets prod: the environment is
# fixed to supabase-dev and the project ref is checked before anything runs.
#
#   reference   cities, streets, road junctions            supabase/seed/reference/load.sh
#   content     organization links, legal texts, surveys,  supabase/seed/content/load.sh
#               the platform organization
#   e2e-users   user1 … user4 @seed.kc.test for tests/e2e  supabase/seed/e2e/load.sql
#   all         the three above, in that order
#
# Every seed is idempotent, so running one again changes nothing that is already loaded. The
# old Hebrew demo dataset (posts, chats, follows) was retired with the migration chain; it is
# kept for reference in supabase/archive/seed-kc-dev-demo.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'which seed to load'
        type: choice
        options: [all, reference, content, e2e-users]
        default: all

permissions:
  contents: read

jobs:
  seed:
    name: seed kc-dev · ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Read by psql; never written to a file or a command line.
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KC_DEV_REF: enbqriuxvvuontiwslun
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard – dev project only
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_REF" != "$KC_DEV_REF" ]; then
            echo "::error::supabase-dev SUPABASE_PROJECT_REF is not kc-dev; refusing."; exit 1
          fi

      - uses: ./.github/actions/setup-supabase-cli

      # `supabase link` records the pooler address of the project (no password in it).
      - name: Link to kc-dev
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes >/dev/null

      - name: Load the seeds
        env:
          E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
        run: |
          set -euo pipefail
          url="$(cat supabase/.temp/pooler-url)"
          case "$url" in postgres*://*) ;; *) echo "::error::no pooler address recorded by supabase link"; exit 1 ;; esac
          case "$url" in *"$KC_DEV_REF"*) ;; *) echo "::error::pooler address is not kc-dev's; refusing."; exit 1 ;; esac
          if [ "$ACTION" = all ] || [ "$ACTION" = reference ]; then
            echo "── reference ──"
            REFERENCE_DB_URL="$url" supabase/seed/reference/load.sh
          fi
          if [ "$ACTION" = all ] || [ "$ACTION" = content ]; then
            echo "── content ──"
            CONTENT_DB_URL="$url" supabase/seed/content/load.sh
          fi
          if [ "$ACTION" = all ] || [ "$ACTION" = e2e-users ]; then
            echo "── e2e users ──"
            [ -n "${E2E_SEED_PASSWORD:-}" ] || { echo "::error::E2E_SEED_PASSWORD secret is not set"; exit 1; }
            {
              echo "select set_config('kc.seed_target', 'dev', false), set_config('kc.seed_password', :'pw', false) \gset"
              cat supabase/seed/e2e/load.sql
            } | psql "$url" -v ON_ERROR_STOP=1 -v pw="$E2E_SEED_PASSWORD" -qAt -f -
          fi
