name: CI — backend

# Database lane, called by ci.yml when migrations, seed/config, the Supabase
# adapter package or CI plumbing changed. Boots a fresh local Supabase stack
# (supabase/migrations: 0001_baseline.sql, then any later migration), runs the
# pgTAP suites of supabase/tests on an empty scratch database of the same server
# (plus the reference and content seed loaders, applied twice), the RPC grants
# check, the database.types.ts drift check, the FSM catalog contract and the
# SECURITY DEFINER SQL probe / port contract integration tests. The migration
# chain, destructive-op and baseline-assembly scans are static and run in
# ci-static-guards.yml.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  db-validate:
    name: apply migrations · rls · types · sql probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI (version pinned in the composite action)
        uses: ./.github/actions/setup-supabase-cli

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Log in to ghcr.io (authenticated image pulls avoid anonymous rate limits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Start Supabase (applies supabase/migrations, the baseline and any later ones)
        run: |
          # Image pulls hit registry rate limits intermittently (`toomanyrequests`
          # on ghcr.io, `Data limit exceeded` on public.ecr.aws) — infra, not a
          # code error — so rotate registries before giving up.
          for reg in docker.io public.ecr.aws ghcr.io docker.io; do
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=$reg
            timeout 300 supabase start -x studio,inbucket,imgproxy,edge-runtime,realtime,storage-api && exit 0
            echo "::warning::supabase start via $reg failed, trying next registry"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1

      # The migrations are built on an empty scratch database of the same server (the state
      # production starts from; the Supabase shim stands in for the platform objects the
      # excluded services would create), its pgTAP suites run, and the seed loaders are
      # proven loadable and idempotent. See docs/db/target-design.md §10.
      - name: TEMP probe 005_geo crash
        continue-on-error: true
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          psql "$DB_URL" -Atc "select version()"
          psql "$DB_URL" -Atc "select extname||' '||extversion from pg_extension order by 1" | tr '\n' ' '
          psql "$DB_URL" -qc "drop database if exists probe_geo with (force)" -c "create database probe_geo"
          U="$(node -e 'const u=new URL(process.argv[1]);u.pathname="/probe_geo";process.stdout.write(u.toString())' "$DB_URL")"
          psql "$U" -v ON_ERROR_STOP=1 -q -f supabase/baseline/local/supabase_shim.sql
          psql "$U" -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/migrations/0001_baseline.sql
          i=0
          for probe in "select 1 from public.streets" "select 1 from public.road_junctions" "select 1 from public.search_places('ganim')"; do
            i=$((i+1))
            { head -65 supabase/tests/005_geo.sql; echo "select pg_temp.rows_as('anon', null, \$q\$${probe}\$q\$);"; } > /tmp/probe_$i.sql
            echo "── probe $i: $probe"
            psql "$U" -q -f /tmp/probe_$i.sql 2>&1 | tail -3 || true
          done

      - name: Migrations apply on an empty database + pgTAP tests + seed loaders
        run: scripts/run-baseline-tests.sh

      - name: Check every client RPC is granted to a client role
        # Functions are owner/service_role-only by default, so a client RPC whose
        # migration forgot its `grant execute … to authenticated` fails here, not in the app.
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" node scripts/check-rpc-grants.mjs

      # The generator is the one that produced the committed file: the migrations are applied
      # to a scratch database of the local stack's server and `@supabase/postgres-meta` (pinned)
      # reads it; partition children are stripped there (they are created relative to now()).
      - name: Check database.types.ts drift
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" node scripts/gen-baseline-types.mjs --check

      # Node 22 is deliberate (sqlProbes need native WebSocket; do not use .nvmrc).
      - name: Setup pnpm + Turbo cache (Node 22)
        uses: ./.github/actions/setup-pnpm-turbo
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: pnpm install --frozen-lockfile

      # Runs vitest directly, not through turbo: a cached test task would skip this
      # contract when only supabase/migrations changed (turbo does not hash that tree).
      - name: FSM catalog contract (baseline SQL vs FSM_MACHINES)
        working-directory: app
        run: pnpm --filter @kc/infrastructure-supabase exec vitest run src/fsm/__tests__/catalogMatchesSql.test.ts

      # The port contract suites (G39) sign in through the anon key, so the three
      # credentials come from the running stack — no CLI demo key is written in
      # the repo. Local-only values; GITHUB_ENV scopes them to this job.
      - name: Export local stack credentials for the integration suites
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # sqlProbes: SECURITY DEFINER RPC probes. contract.integration: the port
      # contract suites run against the Supabase adapters with RLS; the same
      # cases run against the in-memory fakes in the frontend lane.
      - name: SQL probes + port contracts (against local stack)
        working-directory: app
        env:
          CI_LOCAL_SUPABASE: 'true'
        run: pnpm --filter @kc/infrastructure-supabase test sqlProbes contract.integration

      - name: Diagnose (on failure)
        if: failure()
        continue-on-error: true
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          U="${DB_URL%/*}/kc_baseline_check"
          q() { echo "── $1"; psql "$U" -X -v ON_ERROR_STOP=0 -c "$1" 2>&1 | tail -6; }
          wait_db() { for _ in $(seq 1 30); do psql "$U" -X -Atc "select 1" >/dev/null 2>&1 && return 0; sleep 2; done; }
          wait_db
          q "select proacl::text, prosecdef, proconfig::text from pg_proc where proname = 'search_places'"
          q "select has_function_privilege('anon', 'public.search_places(text,text[],integer)', 'execute') as anon_exec, has_function_privilege('public'::name, 'public.search_places(text,text[],integer)', 'execute') as public_exec"
          q "select defaclrole::regrole, defaclnamespace::regnamespace, defaclacl::text from pg_default_acl"
          q "select (select count(*) from public.cities) as cities, (select count(*) from public.road_junctions) as junctions"
          q "begin; set local role authenticated; select count(*) from public.search_places('ganim'); rollback"
          wait_db
          q "select count(*) from public.search_places('ganim')"
          wait_db
          q "begin; set local role anon; select count(*) from public.search_places('ganim'); rollback"
          wait_db

      - name: Database container log (on failure)
        if: failure()
        run: docker ps --filter name=supabase_db -q | xargs -r -n1 docker logs --tail 120 2>&1 | sed -E 's/(password|secret|key)=[^ ]+/\1=***/Ig'

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
