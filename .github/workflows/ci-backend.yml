name: CI — backend

# Database lane, called by ci.yml when migrations, seed/config, the Supabase
# adapter package, the API server (app/apps/api), its client package, its cloud
# environment (infra/) or CI plumbing changed. Boots a fresh local Supabase stack
# (supabase/migrations: 0001_baseline.sql, then any later migration), runs the
# pgTAP suites of supabase/tests on an empty scratch database of the same server
# (plus the reference and content seed loaders, applied twice), the RPC grants
# check, the database.types.ts drift check, the FSM catalog contract, the
# SECURITY DEFINER SQL probe / port contract integration tests and the API
# server's database suites. A second job builds the API's container image and
# starts it; a third checks the API's cloud environment (infra/gcp) without a
# cloud account. The migration chain, destructive-op and baseline-assembly scans
# are static and run in ci-static-guards.yml.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  db-validate:
    name: apply migrations · rls · types · sql probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI (version pinned in the composite action)
        uses: ./.github/actions/setup-supabase-cli

      - name: Install psql client
        # ubuntu-latest ships psql; apt is only a fallback. A mirror outage
        # (azure.archive.ubuntu.com failing to resolve) must not fail the lane.
        run: |
          command -v psql >/dev/null && exit 0
          for _ in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y postgresql-client && exit 0
            sleep 15
          done
          exit 1

      - name: Log in to ghcr.io (authenticated image pulls avoid anonymous rate limits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # A PR adds `next-NN_slug.sql` and the number is assigned on merge (scripts/migration-ids.mjs).
      # Numbering the throwaway checkout first applies and tests the files under the numbers they get.
      - name: Number pending migrations (this checkout only)
        run: node scripts/migration-ids.mjs assign

      - name: Start Supabase (applies supabase/migrations, the baseline and any later ones)
        run: |
          # Image pulls hit registry rate limits intermittently (`toomanyrequests`
          # on ghcr.io, `Data limit exceeded` on public.ecr.aws) — infra, not a
          # code error — so rotate registries before giving up.
          for reg in docker.io public.ecr.aws ghcr.io docker.io; do
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=$reg
            timeout 300 supabase start -x studio,inbucket,imgproxy,edge-runtime,realtime,storage-api && exit 0
            echo "::warning::supabase start via $reg failed, trying next registry"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1

      # The migrations are built on an empty scratch database of the same server (the state
      # production starts from; the Supabase shim stands in for the platform objects the
      # excluded services would create), its pgTAP suites run, and the seed loaders are
      # proven loadable and idempotent. See docs/db/target-design.md §10.
      # The supautils extension in the local Postgres image adds "Grant the required privileges"
      # hints to permission errors of anon/authenticated. For a denied FUNCTION call (no table in the
      # query) its hook dereferences an empty permission list and the backend dies with signal 11,
      # taking every connection down. The pgTAP suites assert exactly that denial (anon cannot call
      # internal functions), so switch the hint feature off for this throwaway stack. It only decorates
      # error text; the privilege checks themselves are unchanged. Production never calls a denied
      # function through PostgREST (it hides them), see docs/db/cutover-runbook.md.
      - name: Disable supautils permission hints (image crash on denied function calls)
        run: |
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n1)"
          test -n "$db_container"
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          # throwaway local stack: supabase_admin shares the local postgres password
          local_pw="$(sed -E 's#^[a-z]+://[^:]*:([^@]*)@.*#\1#' <<<"$DB_URL")"
          docker exec -e PGPASSWORD="$local_pw" "$db_container" psql -h 127.0.0.1 -U supabase_admin -d postgres \
            -v ON_ERROR_STOP=1 -qAt -c "alter system set supautils.hint_roles = ''" -c "select pg_reload_conf()"
          sleep 2
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -qAt <<'SQL'
          create function public.zz_hint_probe(p text) returns text language sql stable as 'select p';
          revoke execute on function public.zz_hint_probe(text) from public, anon, authenticated;
          SQL
          # A denied call must now fail with a normal 42501 instead of killing the server.
          out="$(psql "$DB_URL" -X -qAt -c "begin; set local role anon; select public.zz_hint_probe('x'); rollback" 2>&1 || true)"
          echo "$out" | tail -1
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -qAt -c "drop function public.zz_hint_probe(text)"
          grep -q 'permission denied for function' <<<"$out"

      - name: Migrations apply on an empty database + pgTAP tests + seed loaders
        run: scripts/run-baseline-tests.sh

      - name: Provider identity hash reservation, concurrent commit and rollback
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/idv-provider-venv"
          "$RUNNER_TEMP/idv-provider-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-identity-provider.txt
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          # run-baseline-tests.sh created this scratch DB with all migrations.
          # Never run synthetic identity fixtures on a deployed Supabase project.
          DB_URL="${DB_URL%/*}/kc_baseline_check" "$RUNNER_TEMP/idv-provider-venv/bin/python" scripts/test-identity-provider-concurrency.py

      # The Demo data screen (FR-ADMIN-031) calls RPCs of a dev-only seed (supabase/seed/demo),
      # which kc-dev gets from the Seed KC dev workflow and kc-prod never does. Installed on the
      # throwaway stack (without the dev marker) so the grant check below covers them too.
      - name: Install the dev-only demo-data and production-copy tools on the local stack
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/seed/demo/install.sql
          # The "Copied from production" card (FR-ADMIN-037) calls RPCs of the dev-only copy tools.
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/seed/prod-copy/install.sql

      - name: Check every client RPC is granted to a client role
        # Functions are owner/service_role-only by default, so a client RPC whose
        # migration forgot its `grant execute … to authenticated` fails here, not in the app.
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" node scripts/check-rpc-grants.mjs

      # The generator is the one that produced the committed file: the migrations are applied
      # to a scratch database of the local stack's server and `@supabase/postgres-meta` (pinned)
      # reads it; partition children are stripped there (they are created relative to now()).
      - name: Check database.types.ts drift
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" node scripts/gen-baseline-types.mjs --check

      # Node 22 is deliberate (sqlProbes need native WebSocket; do not use .nvmrc).
      - name: Setup pnpm + Turbo cache (Node 22)
        uses: ./.github/actions/setup-pnpm-turbo
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: pnpm install --frozen-lockfile

      # Runs vitest directly, not through turbo: a cached test task would skip this
      # contract when only supabase/migrations changed (turbo does not hash that tree).
      - name: FSM catalog contract (baseline SQL vs FSM_MACHINES)
        working-directory: app
        run: pnpm --filter @kc/infrastructure-supabase exec vitest run src/fsm/__tests__/catalogMatchesSql.test.ts

      # The port contract suites (G39) sign in through the anon key, so the three
      # credentials come from the running stack — no CLI demo key is written in
      # the repo. Local-only values; GITHUB_ENV scopes them to this job.
      - name: Export local stack credentials for the integration suites
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # sqlProbes: SECURITY DEFINER RPC probes. contract.integration: the port
      # contract suites run against the Supabase adapters with RLS; the same
      # cases run against the in-memory fakes in the frontend lane.
      # The port contracts sign real members in and give them a city, so the stack needs the same
      # reference data (cities, streets, worlds, flags) a deployed database gets from the seed loader.
      - name: Load reference data into the local stack
        run: |
          set -euo pipefail
          REFERENCE_DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" supabase/seed/reference/load.sh

      - name: SQL probes + port contracts (against local stack)
        working-directory: app
        env:
          CI_LOCAL_SUPABASE: 'true'
        run: pnpm --filter @kc/infrastructure-supabase test sqlProbes contract.integration

      # The API server (app/apps/api, ADR-009) answers the app's port calls with these same
      # adapters, on its own connection to this database instead of through PostgREST. Its
      # database suites (port contracts, realtime, storage, jobs, webhooks) run here because
      # this job already holds the server the migrations were proven on, which is also the
      # Postgres build the API talks to until the database itself moves. The frontend lane
      # runs the same package without a database, against the lower unit-only coverage floor.
      - name: Start Redis for the API suites
        run: |
          # Pinned by digest (Redis 7.2, the newest line the hosting plan's managed Redis offers).
          # Registries rate-limit pulls intermittently, so rotate over mirrors of the same image.
          digest=sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
          for repo in mirror.gcr.io/library/redis public.ecr.aws/docker/library/redis docker.io/library/redis; do
            docker run -d --name kc-api-redis -p 127.0.0.1:6379:6379 "$repo@$digest" && break
            echo "::warning::redis pull via $repo failed, trying next registry"
            docker rm -f kc-api-redis >/dev/null 2>&1 || true
            sleep 15
          done
          for _ in $(seq 1 30); do
            docker exec kc-api-redis redis-cli ping 2>/dev/null | grep -q PONG && exit 0
            sleep 1
          done
          exit 1

      # The API's Cloud Storage object store (ADR-012) is checked against the service's emulator:
      # the SDK calls are real HTTP requests. The emulator does not page listings, record
      # Cache-Control or check signed conditions; a real project is checked before a first deploy
      # (app/apps/api/README.md, "File storage").
      - name: Start the Cloud Storage emulator for the API suites
        run: |
          # fake-gcs-server 1.52, pinned by digest; the same image on two registries.
          digest=sha256:666f86b873120818b10a5e68d99401422fcf8b00c1f27fe89599c35236f48b4c
          for repo in mirror.gcr.io/fsouza/fake-gcs-server docker.io/fsouza/fake-gcs-server; do
            docker run -d --name kc-api-gcs -p 127.0.0.1:4443:4443 "$repo@$digest" \
              -scheme http -port 4443 -backend memory -public-host 127.0.0.1:4443 -external-url http://127.0.0.1:4443 && break
            echo "::warning::emulator pull via $repo failed, trying next registry"
            docker rm -f kc-api-gcs >/dev/null 2>&1 || true
            sleep 15
          done
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null 'http://127.0.0.1:4443/storage/v1/b?project=kc-test' && exit 0
            sleep 1
          done
          exit 1

      # An empty database of the local stack's server with the whole migration chain and the
      # reference data. The connection string is local-only; GITHUB_ENV scopes it to this job.
      - name: Build the API's test database
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          DB_URL="$DB_URL" app/apps/api/scripts/kc-test-db.sh | grep '^KC_API_TEST_KC_DATABASE_URL=' >> "$GITHUB_ENV"
          # The server under test connects as the API's own database user (kc_api), which holds
          # no rights until it switches role: the shape of a deployment, not the fixtures' owner
          # connection. The password is made here, for this throwaway server only.
          api_password="$(openssl rand -hex 24)"
          echo "::add-mask::$api_password"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -c "alter role kc_api password '$api_password'"
          api_url="$(sed -E "s#://[^@]*@#://kc_api:${api_password}@#" <<<"${DB_URL%/*}/kc_api_test")"
          echo "KC_API_TEST_API_DATABASE_URL=$api_url" >> "$GITHUB_ENV"

      # KC_API_TEST_DISPOSABLE_DATABASE also collects the platform suites, which create roles
      # and a schema of their own: allowed here, the database is thrown away with the stack.
      # With every suite collected, vitest holds the run to the full coverage floor.
      - name: API database suites + full coverage floor (against local stack)
        working-directory: app
        env:
          REDIS_URL: redis://127.0.0.1:6379
          KC_API_TEST_DISPOSABLE_DATABASE: '1'
          KC_API_TEST_GCS_ENDPOINT: http://127.0.0.1:4443
        run: DATABASE_URL="$KC_API_TEST_KC_DATABASE_URL" pnpm --filter @kc/api test:coverage

      - name: Diagnose (on failure)
        if: failure()
        continue-on-error: true
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          U="${DB_URL%/*}/kc_baseline_check"
          q() { echo "── $1"; psql "$U" -X -v ON_ERROR_STOP=0 -c "$1" 2>&1 | tail -6; }
          wait_db() { for _ in $(seq 1 30); do psql "$U" -X -Atc "select 1" >/dev/null 2>&1 && return 0; sleep 2; done; }
          wait_db
          q "select proacl::text, prosecdef, proconfig::text from pg_proc where proname = 'search_places'"
          q "select has_function_privilege('anon', 'public.search_places(text,text[],integer)', 'execute') as anon_exec, has_function_privilege('public'::name, 'public.search_places(text,text[],integer)', 'execute') as public_exec"
          q "select defaclrole::regrole, defaclnamespace::regnamespace, defaclacl::text from pg_default_acl"
          q "select (select count(*) from public.cities) as cities, (select count(*) from public.road_junctions) as junctions"
          q "begin; set local role authenticated; select count(*) from public.search_places('ganim'); rollback"
          wait_db
          q "select count(*) from public.search_places('ganim')"
          wait_db
          q "begin; set local role anon; select count(*) from public.search_places('ganim'); rollback"
          wait_db

      - name: Database container log (on failure)
        if: failure()
        run: docker ps --filter name=supabase_db -q | xargs -r -n1 docker logs --tail 120 2>&1 | sed -E 's/(password|secret|key)=[^ ]+/\1=***/Ig'

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  # The cloud environment of the API (infra/gcp, ADR-009 phase 2). No cloud account is
  # involved: the configuration is formatted, validated and tested against a mocked provider.
  infra:
    name: cloud environment · terraform fmt · validate · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned release binary, fetched directly and checked against its SHA-256 (from the
      # release's terraform_<version>_SHA256SUMS), as the workflow linter is.
      - name: Install Terraform 1.17.2
        env:
          TERRAFORM_VERSION: 1.17.2
          TERRAFORM_SHA256: e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b
        run: |
          set -euo pipefail
          asset="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$asset" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${asset}"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict -
          unzip -q "$RUNNER_TEMP/$asset" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Format
        working-directory: infra/gcp
        run: terraform fmt -check -recursive

      # The provider is the version and checksums of .terraform.lock.hcl; no state is read.
      - name: Validate
        working-directory: infra/gcp
        run: terraform init -backend=false -input=false -lockfile=readonly && terraform validate

      - name: Test (mocked provider)
        working-directory: infra/gcp
        run: terraform test

  # The image is what the hosting platform runs (ADR-009 phase 2). Building it proves the
  # Dockerfile, the bundle and the production dependency set; starting it proves the process
  # boots as an unprivileged user, answers liveness, reports unreachable dependencies as not
  # ready instead of crashing, and ends cleanly on a stop signal. Nothing is pushed anywhere.
  api-image:
    name: api container image · build · start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: |
          # One retry: a base-image pull can hit a registry rate limit; a real build error fails twice.
          docker build -f app/apps/api/Dockerfile -t kc-api:ci app/ && exit 0
          sleep 30
          docker build -f app/apps/api/Dockerfile -t kc-api:ci app/

      - name: Start it without its dependencies
        run: |
          set -euo pipefail
          # Nothing listens on these two ports, and the issuer is never contacted at start.
          docker run -d --name kc-api -p 127.0.0.1:8080:8080 \
            -e DATABASE_URL=postgres://ci@127.0.0.1:5999/ci \
            -e REDIS_URL=redis://127.0.0.1:6999 \
            -e KC_AUTH_ISSUER=https://auth.invalid/auth/v1 \
            kc-api:ci
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8080/health && break
            sleep 1
          done
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          test "$(status /health)" = 200
          test "$(status /health/ready)" = 503
          test "$(docker exec kc-api id -u)" != 0
          docker stop -t 10 kc-api >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' kc-api)" = 0

      - name: Container log (on failure)
        if: failure()
        run: docker logs --tail 80 kc-api 2>&1 || true
