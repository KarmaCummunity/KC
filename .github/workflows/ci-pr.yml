name: CI — PR hygiene

# Called by ci.yml for `pull_request` events only (the payload below is the
# caller's PR). ci.yml also listens to `edited`, so a title or body fix
# re-runs this check without a new push.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 2
    steps:
      - name: Require Conventional Commits PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            perf
            build
            ci
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter
            (Conventional Commits style).

      # GitHub's squash default includes commit messages. Historical version-bump
      # messages imported by a merge can silently suppress post-merge push CI.
      # Refuse before queue entry; do not bypass certification or rewrite dev history.
      - name: Refuse CI-skipping squash messages on dev
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            // Release/main uses its separate approval flow; this guard changes only dev hygiene.
            if (pr.base.ref !== 'dev') return;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const inputs = [pr.title || '', pr.body || '', ...commits.map(c => c.commit.message)];
            const marker = /\[(?:skip ci|ci skip|no ci|skip actions|actions skip)\]|^\s*skip-checks:\s*true\s*$/im;
            if (inputs.some(text => marker.test(text))) {
              core.setFailed('CI-skipping marker in a possible DEV squash message. Rebuild the reviewed diff on a clean branch without historical skip markers before queueing. Do not bypass post-merge CI.');
            }

      # Bot-authored PRs (dependabot dependency bumps) have no spec mapping and
      # never will — requiring it permanently wedges every dependency-update PR.
      # Skip the body check for them; the Conventional Commits title rule above
      # still applies (dependabot uses `chore(deps): …`).
      - name: Require "Mapped to spec" line in PR body
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (!/Mapped to spec/i.test(body)) {
              core.setFailed(
                'PR body is missing a "Mapped to spec" section. ' +
                'See .github/PULL_REQUEST_TEMPLATE.md.'
              );
            }
