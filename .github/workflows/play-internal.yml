# Google Play internal-track upload: EAS cloud AAB + `eas submit`. Never promotes
# beyond the internal track (eas.json submits a draft with changesNotSentForReview).
#
# Callers: the nightly pipeline (mobile-nightly.yml, `workflow_call` with the
# green SHA) and manual dispatch on dev. Manual dispatch resolves the newest dev
# commit with a successful CI push run (scripts/mobile-store-target.mjs), or
# accepts an optional `ref` input validated the same way. A `[skip ci]` bump
# commit may inherit its parent's green `CI gate` on dev when it matches the
# bump workflow shape (same policy as scripts/deploy-target.mjs and
# testflight-ios.yml). The commit built must be certified on dev (D-195
# "Mobile nightly"). Tester builds use the eas.json
# `nightly` profile and the kc-dev Supabase backend. PROD store builds are
# started only by prod-store-build.yml (`backend: prod`), which builds the
# tagged main SHA with the EAS `production` profile, pins kc-prod, and refuses
# the kc-dev ref. Do not dispatch this workflow with backend=prod directly.
#
# Runs in the `mobile-store` GitHub Environment (deployment branches: dev, main).
# Required, fail closed when unset:
#   secrets  EXPO_TOKEN, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON,
#            MOBILE_SUPABASE_ANON_KEY (kc-dev) or MOBILE_SUPABASE_ANON_KEY_PROD (kc-prod, when backend=prod)
#   vars     KC_EAS_PROJECT_ID
# The AAB builds on EAS cloud, where the runner env never arrives: the Sentry DSN/org/
# project/url are pinned into the `nightly` profile env by mobile-store-config.mjs (from
# mobile-store vars); SENTRY_AUTH_TOKEN and the FCM config (GOOGLE_SERVICES_JSON) come
# from the EAS "preview" environment that the profile selects.
name: Play Internal Android

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build (must have a successful CI push run on dev unless backend is prod)
        type: string
        required: true
      backend:
        description: dev (default, kc-dev + EAS nightly) or prod (kc-prod + EAS production, only from prod-store-build.yml)
        type: string
        required: false
        default: dev
    outputs:
      version_code:
        description: Android versionCode of the submitted AAB
        value: ${{ jobs.play-internal.outputs.version_code }}
  workflow_dispatch:
    inputs:
      ref:
        description: Optional dev commit SHA to build (default resolves the newest green dev commit, including a [skip ci] version-bump tip that inherits its parent's green CI gate)
        type: string
        required: false

permissions:
  contents: read

env:
  PACKAGE_NAME: org.karmacommunity.app
  # Same eas-cli pin in testflight-ios.yml and kc-mobile-eas-preview.yml; bump all three together.
  EAS_CLI_VERSION: 24.12.1

jobs:
  play-internal:
    name: Build AAB & submit to Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-store
    env:
      STORE_BACKEND: ${{ inputs.backend || 'dev' }}
      EAS_PROFILE: ${{ (inputs.backend || 'dev') == 'prod' && 'production' || 'nightly' }}
    permissions:
      contents: read
      actions: read # read CI runs to verify the commit is green
    # Never cancel an in-flight build: it has already consumed an EAS
    # versionCode. The group is per caller (`github.workflow` is the caller's
    # name in a called run), so queued manual runs can only displace each
    # other, never a nightly run, which mobile-nightly.yml already serialises.
    concurrency:
      group: play-internal-android-${{ github.workflow }}
      cancel-in-progress: false
    outputs:
      version_code: ${{ steps.build.outputs.version_code }}
    defaults:
      run:
        working-directory: app/apps/mobile
    steps:
      # Sparse checkout only under .store-target so the full build checkout
      # below never inherits sparse state (pnpm/action-setup needs app/package.json).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .store-target
          sparse-checkout: |
            .nvmrc
            scripts/deploy-target.mjs
            scripts/resolve-green-dev-sha.mjs
            scripts/mobile-store-target.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .store-target/.nvmrc
      - name: Resolve the certified SHA
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          LOOKBACK: '30'
        working-directory: .
        run: |
          set -euo pipefail
          if [ "$STORE_BACKEND" = "prod" ]; then
            sha="${INPUT_REF:-}"
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::PROD store builds require a 40-character main SHA"
              exit 1
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "Resolved PROD store SHA $sha on main (certified by prod-store-build.yml)"
          else
            node .store-target/scripts/mobile-store-target.mjs
          fi

      - name: Preflight secrets (fail closed)
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MOBILE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
          MOBILE_SUPABASE_ANON_KEY_PROD: ${{ secrets.MOBILE_SUPABASE_ANON_KEY_PROD }}
          KC_EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [ "$STORE_BACKEND" = "prod" ]; then
            supabase_key=MOBILE_SUPABASE_ANON_KEY_PROD
          else
            supabase_key=MOBILE_SUPABASE_ANON_KEY
          fi
          for n in EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_JSON "$supabase_key" KC_EAS_PROJECT_ID; do
            [ -n "${!n:-}" ] || missing+=("$n")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Play internal cannot run — missing secrets/variables (repo or mobile-store environment): ${missing[*]}"
            exit 1
          fi
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email|length>0)' >/dev/null; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a valid service account JSON"
            exit 1
          fi
          echo "All Play internal secrets present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Writes the selected backend (kc-dev into `nightly`, or kc-prod into
      # `production`) and the Sentry vars into eas.json on the runner only.
      - name: Pin the Supabase backend
        working-directory: .
        env:
          SOURCE_BRANCH: ${{ steps.target.outputs.branch }}
          MOBILE_SUPABASE_ANON_KEY: ${{ env.STORE_BACKEND == 'prod' && secrets.MOBILE_SUPABASE_ANON_KEY_PROD || secrets.MOBILE_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: node scripts/mobile-store-config.mjs pin

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g "eas-cli@$EAS_CLI_VERSION" --ignore-scripts

      - name: Verify Android package
        run: |
          set -euo pipefail
          actual="$(npx --yes expo config --json --type public | jq -r '.android.package')"
          if [ "$actual" != "$PACKAGE_NAME" ]; then
            echo "::error::Android package is '$actual', expected '$PACKAGE_NAME'"
            exit 1
          fi

      - name: Write Play service account key (runner temp, never committed)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          # Path must match eas.json submit.production.android.serviceAccountKeyPath (gitignored).
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./google-play-service-account.json

      - name: Build AAB on EAS, verify the backend & submit to Play internal
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.KC_EAS_PROJECT_ID }}
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          eas build --platform android --profile "$EAS_PROFILE" --non-interactive --wait --json > build.json
          url="$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
          [ -n "$url" ] || { echo "::error::No AAB artifact URL from EAS"; exit 1; }
          # Refuse to submit unless the shipped JS bundle points at the selected
          # backend only. The cloud builder also receives EAS server variables, so
          # check the artifact.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/app.aab" "$url"
          unzip -p "$RUNNER_TEMP/app.aab" 'base/assets/index.android.bundle' > "$RUNNER_TEMP/index.android.bundle"
          node "$GITHUB_WORKSPACE/scripts/mobile-store-config.mjs" verify "$RUNNER_TEMP/index.android.bundle"
          # The versionCode of this very build (EAS remote autoIncrement assigned it).
          version_code="$(jq -r '.[0].appBuildVersion // empty' build.json)"
          [ -n "$version_code" ] || { echo "::error::EAS returned no appBuildVersion (versionCode)"; exit 1; }
          eas submit --platform android --profile production --url "$url" --non-interactive
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Play internal upload: Android versionCode $version_code from $BUILD_SHA ($STORE_BACKEND backend, profile $EAS_PROFILE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key file
        if: always()
        working-directory: .
        run: rm -f app/apps/mobile/google-play-service-account.json
