name: E2E post photos (dev)

# Proof on kc-dev that a member's post photo reaches other members only as a copy without
# metadata (FR-POST-005 AC4, NFR-PRIV-002, KC#2316). scripts/e2e-post-media.mjs creates two
# throwaway members, uploads a photo carrying a GPS block as the owner, records it the way the
# app does, waits for the database to start process-post-media and the row to become ready, then
# reads the post as the viewer and fails unless the copy and its thumb are free of the block.
#
# Never targets prod: the environment is fixed to supabase-dev, the project ref is checked
# before anything runs, and the script itself refuses any project but kc-dev.
#
# It runs nightly, on demand, and whenever the proof itself changes on dev, so a change to the
# script or to this file is proven by the merge that brings it. A change to the worker is proven
# by the next nightly run, after its deploy.
on:
  schedule:
    - cron: '47 2 * * *' # 02:47 UTC, after the account purge proof
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/e2e-post-media-dev.yml
      - scripts/e2e-post-media.mjs
      - scripts/e2e-account-purge.mjs

permissions:
  contents: read

# One proof at a time; a second run waits instead of cancelling one half-way (it cleans up after itself).
concurrency:
  group: e2e-post-media-dev
  cancel-in-progress: false

jobs:
  proof:
    name: post photo proof (kc-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Read by psql; never written to a file or a command line.
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KC_DEV_REF: enbqriuxvvuontiwslun
    steps:
      # Cron runs this workflow file from the default branch. The proof always runs dev's
      # script, because kc-dev runs dev's worker.
      # fetch-tags: false avoids the D-195 tag-ruleset collision on `dev`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/dev
          fetch-tags: false
          persist-credentials: false

      - name: Guard – dev project only
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_REF" != "$KC_DEV_REF" ]; then
            echo "::error::supabase-dev SUPABASE_PROJECT_REF is not kc-dev; refusing."; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-supabase-cli

      # `supabase link` records the pooler address of the project (no password in it).
      - name: Link to kc-dev
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes >/dev/null

      # The two API keys are read from the Management API with the environment's access
      # token and masked at once. They reach the script through its environment, never as
      # an argument, and the script prints neither.
      - name: Run the proof
        run: |
          set -euo pipefail
          url="$(cat supabase/.temp/pooler-url)"
          case "$url" in postgres*://*) ;; *) echo "::error::no pooler address recorded by supabase link"; exit 1 ;; esac
          case "$url" in *"$KC_DEV_REF"*) ;; *) echo "::error::pooler address is not kc-dev's; refusing."; exit 1 ;; esac
          keys="$(supabase projects api-keys --project-ref "$KC_DEV_REF" -o json)"
          service="$(jq -r '[.[] | select(.name == "service_role" or .id == "service_role")][0].api_key // empty' <<<"$keys")"
          anon="$(jq -r '[.[] | select(.name == "anon" or .id == "anon")][0].api_key // empty' <<<"$keys")"
          if [ -z "$service" ] || [ -z "$anon" ]; then
            echo "::error::kc-dev did not return its anon and service_role keys"; exit 1
          fi
          echo "::add-mask::$service"
          echo "::add-mask::$anon"
          PROOF_DB_URL="$url" SUPABASE_URL="https://${KC_DEV_REF}.supabase.co" \
            SUPABASE_ANON_KEY="$anon" SUPABASE_SERVICE_ROLE_KEY="$service" \
            node scripts/e2e-post-media.mjs
