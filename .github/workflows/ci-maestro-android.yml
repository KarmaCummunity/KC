name: CI — Maestro Android E2E

# Maestro lane, called by ci.yml on a PR whose diff touches the app, its packages, the flows or their
# runner (scripts/ci-changes.mjs MAESTRO_RULES), and by maestro-dev-health.yml for the non-blocking
# runs on `dev`. KC#1235 / #1619. It taps through the critical journeys (.maestro/flows) on an Android
# emulator against kc-dev. The APK is a local Gradle release build (no EAS, no EXPO_TOKEN) with OTA
# updates off (KC_E2E_BUILD=1), so it runs exactly the JS of the commit it was called for.
# Runbook: docs/process/MAESTRO.md
#
# The CI gate fails when this lane fails, which is what makes the journeys required for such a PR
# (D-195: the gate is the only required check). A lane's jobs may only skip on an input ci.yml
# passes, so this job has no `if`; drafts never reach it (the gate fails them first).

on:
  workflow_call:
    secrets:
      E2E_SEED_PASSWORD:
        description: kc-dev seed users' password (every flow signs in with it)
        required: true
  # A manual run on any branch (Actions → this workflow → Run workflow), for example to check a change
  # to the app or the flows before the lane has planned it. Secrets come from the repository.
  workflow_dispatch:

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.0
  # The emulator image runs x86_64; building one ABI keeps the native compile short.
  E2E_ABI: x86_64
  # The APK has no EXPO_PUBLIC_ENVIRONMENT, so launchSurfaces.ts treats it as production and hides
  # email sign-in (#2134); every flow signs in with the seed user's email. The build override beats
  # that default (a remote app_flags row would beat it, and kc-dev has none). Read by Expo at
  # prebuild/bundle time, so it applies to both build steps below.
  EXPO_PUBLIC_LAUNCH_EMAIL_AUTH: '1'

jobs:
  android-e2e:
    name: maestro · android emulator
    runs-on: ubuntu-latest
    # Build (~15 min, ~30 with the retry) + flows (55) + up to 125 queued for a kc-dev test slot, with
    # slack. A hang now ends as a timeout of the step that hung, not as a 4-hour run.
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read # the kc-dev test slot reads which jobs are running

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned guard-script dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Unit-test the E2E helpers, native captures and flow ↔ testID contract
        run: node --test scripts/maestro-dev-env.test.mjs scripts/maestro-flows.test.mjs scripts/native-capture-safety.test.mjs scripts/native-success-captures.test.mjs scripts/native-capture-media.test.mjs scripts/native-capture-precedence.test.mjs

      - name: Resolve kc-dev environment (public anon key + seed password)
        env:
          DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
          E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/maestro-dev-env.mjs > "$RUNNER_TEMP/kc-dev.env"
          while IFS='=' read -r key value; do
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/kc-dev.env"

      - uses: ./.github/actions/setup-pnpm-turbo

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build E2E release APK (expo prebuild + Gradle)
        id: build-apk
        continue-on-error: true
        working-directory: app/apps/mobile
        env:
          KC_E2E_BUILD: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          cd android
          # The template's 512m Metaspace runs out in :expo-modules-core:lintVitalAnalyzeRelease;
          # the 16 GB runner affords a larger daemon. Fail fast if the template line ever changes.
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m/' gradle.properties
          grep -q '^org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m$' gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures="$E2E_ABI" --console=plain
          echo "E2E_APK=$PWD/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Retry build E2E release APK on failure
        if: steps.build-apk.outcome == 'failure'
        working-directory: app/apps/mobile
        env:
          KC_E2E_BUILD: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "::warning::First Gradle build attempt failed; retrying assembleRelease..."
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install --clean
          fi
          cd android
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m/' gradle.properties
          grep -q '^org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m$' gradle.properties || true
          ./gradlew --stop || true
          ./gradlew assembleRelease -PreactNativeArchitectures="$E2E_ABI" --console=plain
          echo "E2E_APK=$PWD/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # kc-dev (Free/Nano) stalls when several suites hit it at once (13/14/15 Nov 2026), so at
      # most KC_DEV_TEST_SLOTS suites (default 2) run their tests against it together; the rest
      # queue here FIFO. An API error (rate limit) waits and asks again; only after 120 min does
      # it proceed without a slot.
      - name: Wait for a kc-dev test slot
        timeout-minutes: 125
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KC_DEV_TEST_SLOTS: ${{ vars.KC_DEV_TEST_SLOTS }}
        # An older checked-out tree (e.g. mobile-nightly's pinned SHA) has no throttle yet.
        run: if [ -f scripts/kc-dev-slot.mjs ]; then node scripts/kc-dev-slot.mjs; else echo 'no kc-dev slot script in this tree'; fi

      # A green run takes 24–28 min (19 flows). 55 min is twice that; the runner itself stops early,
      # failed, when kc-dev is down or 3 flows in a row fail twice (scripts/maestro-run-android.sh).
      - name: Run Maestro flows on the emulator
        timeout-minutes: 55
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Boot takes ~40 s on a KVM runner; a boot that has not finished in 5 min will not.
          emulator-boot-timeout: 300
          # Start adb before the emulator, so the emulator registers with a running server. Without
          # it the emulator logs "ERROR | Unable to connect to adb daemon on port: 5037" (harmless:
          # the action's first `adb` call starts the server 8 s later and boot completes), which was
          # mistaken for the cause of the 15 Nov cancellations.
          pre-emulator-launch-script: $ANDROID_HOME/platform-tools/adb start-server
          # One command: the action runs each script line in its own shell.
          script: bash scripts/maestro-run-android.sh "$E2E_APK" "$RUNNER_TEMP/maestro"

      - name: Remove unsafe automatic media from capture flows
        id: native-capture-privacy
        if: always()
        run: |
          for label in 07-create-post-form 07-create-post-form-retry 19-edit-profile-keyboard-toolbar 19-edit-profile-keyboard-toolbar-retry; do
            node scripts/maestro-native-capture-media.mjs "$RUNNER_TEMP/maestro" "$label"
          done

      - name: Upload Maestro reports, screenshots and failure videos
        if: always() && steps.native-capture-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-android
          path: ${{ runner.temp }}/maestro
          # Maestro writes screenshots, the view hierarchy and maestro.log of every flow to
          # <debug>/.maestro/tests/..., a hidden folder that is skipped unless this is on.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
