name: Assign ids on merge

# Post-merge bookkeeping on `dev`: assigns registry IDs. Each ID placeholder a
# PR added becomes the next free number (scripts/spec-ids.mjs), so parallel PRs
# never collide on a D# / TD-# / S# / G# / engineering D-# number. The same
# commit numbers the migrations: each `supabase/migrations/next-NN_slug.sql`
# becomes the next free `NNNN_slug.sql` (scripts/migration-ids.mjs), so
# parallel PRs never collide on a migration number or wait in the merge queue
# for a renumber. A merge with no placeholders produces no commit.
#
# The ID commit runs CI like any merge (no `[skip ci]`): it may rewrite
# citations anywhere, so it must be certified on its own.
#
# No version bump here any more (#2613): a per-merge `[skip ci]` push moved
# `dev` under the merge queue and rebuilt every queued group. app/VERSION now
# moves only at release time — the store build checks it is ahead of the last
# shipped `v*` tag and, if not, opens one version PR through the queue
# (scripts/store-version.mjs, mobile-nightly.yml; release-train.mjs does the
# same for dev → main). The file name stays for history and the environment.
#
# Pushes as the `kc-version-bump` GitHub App (Contents write, nothing else),
# whose ID and key live only in the `dev`-only `version-bump` environment. The
# App is the `dev` ruleset's bypass actor, so its push skips the merge queue;
# it has no Pull requests permission, so it cannot merge or approve anything.
# GITHUB_TOKEN cannot replace it: its pushes start no workflows, so the ID
# commit would never be certified by CI.

on:
  push:
    branches: [dev]

# One run at a time; each run re-reads the tip of `dev`. GitHub keeps only one
# pending run per group, so a newer pending run replaces an older one. The run
# triggered by this workflow's own ID commit is skipped by the job `if` below,
# so it takes a group of its own and never displaces a merge's pending run.
concurrency:
  group: "${{ startsWith(github.event.head_commit.message, 'chore(release): assign spec ids') && format('bump-version-on-merge-own-{0}', github.run_id) || 'bump-version-on-merge' }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assign:
    name: assign spec and migration ids
    # Skip our own commit, otherwise the push below would trigger this again.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release): assign spec ids') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Branch-restricted to `dev`: a workflow pushed on any other branch cannot
    # read the App key (repository-level secrets would be readable, TD-223).
    environment: version-bump
    steps:
      - name: Require the version-bump App
        env:
          APP_ID: ${{ secrets.VERSION_BUMP_APP_ID }}
          APP_KEY: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY are not set in the version-bump environment; ids cannot be assigned. See docs/SSOT/OPERATOR_RUNBOOK.md § Owner setup for D-195 CI/CD."
            exit 1
          fi

      # Short-lived installation token, scoped to this repository only.
      - name: Mint the version-bump App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Assign spec ids and push to dev
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `dev` may move between checkout and push, so retry on a fresh tip.
          # Each attempt re-reads the registries, so numbers stay unique even
          # when several merges land close together. A retry after a racing
          # run's push finds no placeholders left.
          for attempt in 1 2 3; do
            git fetch --depth=2 origin dev
            git reset --hard origin/dev
            node scripts/spec-ids.mjs assign
            node scripts/migration-ids.mjs assign
            # `-u` stages edits and deletions; the renamed migrations are new paths.
            git add -u
            git add -A supabase/migrations
            if git diff --cached --quiet; then
              echo "No id placeholders on dev; nothing to commit."
              exit 0
            fi
            git commit -m "chore(release): assign spec ids"
            if git push origin HEAD:dev; then
              echo "Assigned ids on dev"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying on the new tip of dev"
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the id commit to dev. If the ruleset rejected it, add the kc-version-bump App as the dev ruleset's bypass actor (TD-231)."
          exit 1
