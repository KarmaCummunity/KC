name: Bump app version on merge

# Post-merge bookkeeping and automatic version checkpoints on `dev`:
# 1. Assigns registry IDs: each ID placeholder a PR added becomes the next free
#    number (scripts/spec-ids.mjs), so parallel PRs never collide on a
#    D# / TD-# / S# / G# / engineering D-# number. The same commit numbers the
#    migrations: each `supabase/migrations/next-NN_slug.sql` becomes the next free
#    `NNNN_slug.sql` (scripts/migration-ids.mjs), so parallel PRs never collide on
#    a migration number or wait in the merge queue for a renumber.
# 2. Bumps `app/VERSION` PATCH, so PRs no longer edit the file themselves
#    (TD-196): two open PRs that both bump it always conflict.
#
# PATCH checkpoints coalesce for up to 60 minutes from the last VERSION change,
# never until an empty merge queue. A DEV-side waiter survives without another
# merge and catches up automatically. Runner/check delays are additional.
# ID assignment runs independently, so the waiter cannot hold migrations back.
# Version-only pushes can rebuild waiting merge groups, at most once per window.
# Existing CI/deploy certification and store-release gates are unchanged.
#
# A PR that edits `app/VERSION` itself (a MINOR/MAJOR release) gets no bump, but
# its placeholders are still assigned.
#
# The ID commit runs CI like any merge (no `[skip ci]`): it may rewrite
# citations anywhere, so it must be certified on its own. The bump commit
# carries `[skip ci]`: it changes one file, and a full CI run per merge would
# double the cost. The dev deploy still ships it: deploy.yml also triggers on
# this workflow's name, and scripts/deploy-target.mjs deploys the bump commit
# on its parent's green `CI gate` (TD-231). That inheritance keys on the bump
# commit's exact output — the git identity, the commit subject and
# app/VERSION as the only changed file — so keep the three in sync with
# deploy-target.mjs (BUMP_IDENTITY, BUMP_SUBJECT, VERSION_FILE), never fold the
# ID rewrite into the bump commit, and renaming this workflow requires the same
# rename in deploy.yml's `workflows:` list.
#
# Pushes as the `kc-version-bump` GitHub App (Contents write, nothing else),
# whose ID and key live only in the `dev`-only `version-bump` environment. The
# App is the `dev` ruleset's bypass actor, so its push skips the merge queue;
# it has no Pull requests permission, so it cannot merge or approve anything.
# GITHUB_TOKEN cannot replace it: its pushes start no workflows, so the ID
# commit would never be certified by CI.

on:
  push:
    branches: [dev]
  # Operational replay only; automatic catch-up never depends on dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: assign registry and migration IDs
    outputs:
      explicit_version: ${{ steps.assign.outputs.explicit_version }}
    # Skip our own commit, otherwise the push below would trigger this again.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release): bump app version')
        && !startsWith(github.event.head_commit.message, 'chore(release): assign spec ids') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dev-id-assignment
      cancel-in-progress: false
    # Branch-restricted to `dev`: a workflow pushed on any other branch cannot
    # read the App key (repository-level secrets would be readable, TD-223).
    environment: version-bump
    steps:
      - name: Require the version-bump App
        env:
          APP_ID: ${{ secrets.VERSION_BUMP_APP_ID }}
          APP_KEY: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY are not set in the version-bump environment; the version cannot be bumped. See docs/SSOT/OPERATOR_RUNBOOK.md § Owner setup for D-195 CI/CD."
            exit 1
          fi

      # Short-lived installation token, scoped to this repository only.
      - name: Mint the version-bump App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Assign registry and migration IDs immediately
        id: assign
        run: |
          set -euo pipefail
          changed="$(git show --name-only --format= HEAD)"
          if grep -qx 'app/VERSION' <<<"$changed"; then
            echo "explicit_version=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `dev` may move between checkout and push, so retry on a fresh tip.
          # Each attempt re-reads the registries, so numbers stay unique even
          # when several merges land close together.
          for attempt in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev

            # 1. Registry IDs, pushed on their own so CI certifies them and the
            #    bump below stays a VERSION-only child of a gated commit. A
            #    retry after this push finds no placeholders left.
            node scripts/spec-ids.mjs assign
            node scripts/migration-ids.mjs assign
            # `-u` stages edits and deletions; the renamed migrations are new paths.
            git add -u
            git add -A supabase/migrations
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): assign spec ids"
              if ! git push origin HEAD:dev; then
                echo "Push rejected (attempt ${attempt}); retrying on the new tip of dev"
                sleep $((attempt * 5))
                continue
              fi
            fi

            exit 0

          done

          echo "::error::Could not push the post-merge commit to dev. If the ruleset rejected it, add the kc-version-bump App as the dev ruleset's bypass actor (TD-231)."
          exit 1

  checkpoint:
    name: bounded DEV version checkpoint
    needs: bump
    if: ${{ github.ref == 'refs/heads/dev' && needs.bump.result == 'success' && needs.bump.outputs.explicit_version != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: version-bump
    concurrency:
      group: dev-version-checkpoint
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Wait for bounded checkpoint eligibility
        id: eligibility
        run: node scripts/version-checkpoint.mjs
      - name: Require the version-bump App
        if: steps.eligibility.outputs.proceed == 'true'
        env:
          APP_ID: ${{ secrets.VERSION_BUMP_APP_ID }}
          APP_KEY: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY are not set in the version-bump environment; the version cannot be bumped. See docs/SSOT/OPERATOR_RUNBOOK.md § Owner setup for D-195 CI/CD."
            exit 1
          fi

      # Short-lived installation token, scoped to this repository only.
      - name: Mint the version-bump App token
        if: steps.eligibility.outputs.proceed == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.eligibility.outputs.proceed == 'true'
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Commit the eligible VERSION-only checkpoint
        if: steps.eligibility.outputs.proceed == 'true'
        env:
          EXPECTED_CHECKPOINT: ${{ steps.eligibility.outputs.checkpoint }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 20); do
            git fetch origin dev
            git reset --hard origin/dev
            # Revalidate after waiting, token minting, checkout and every racing push.
            checkpoint="$(git log -1 --format=%H -- app/VERSION)"
            if [ "$checkpoint" != "$EXPECTED_CHECKPOINT" ] || [ "$(git rev-parse HEAD)" = "$checkpoint" ]; then
              echo "A VERSION checkpoint already covers this run; nothing to bump."
              exit 0
            fi
            # Assigners have separate concurrency and continue while this job waits.
            # Let a just-landed migration obtain its real ID before a VERSION child.
            if ! node scripts/migration-ids.mjs list; then
              echo "Waiting for immediate migration assignment"
              sleep 15
              continue
            fi
            node scripts/bump-app-version.mjs
            version="$(tr -d '[:space:]' < app/VERSION)"
            git add app/VERSION
            git commit -m "chore(release): bump app version to ${version} [skip ci]"
            if git push origin HEAD:dev; then
              echo "Bumped to ${version}"
              exit 0
            fi
            echo "Push raced a merge; retrying on current DEV"
            sleep 15
          done
          echo "::error::Could not commit the eligible checkpoint after automatic retries."
          exit 1
