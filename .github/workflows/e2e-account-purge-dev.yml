name: E2E account purge (dev)

# Proof on kc-dev that purging a deleted account removes all of the member's media
# (FR-SETTINGS-012 AC2 and AC4, SEC-1065). scripts/e2e-account-purge.mjs creates a throwaway
# member, plants a file in every storage bucket, deletes the account as the member, moves
# that account's purge date into the past and has the database start purge-deleted-accounts
# the way its daily job does (with the key the database keeps in Vault). It fails unless
# every folder is empty and the auth identity is gone.
#
# Never targets prod: the environment is fixed to supabase-dev, the project ref is checked
# before anything runs, and the script itself refuses any project but kc-dev.
#
# It runs nightly, on demand, and whenever the proof itself changes on dev, so a change to
# the script or to this file is proven by the merge that brings it.
on:
  schedule:
    - cron: '37 2 * * *' # 02:37 UTC, off the :00 rush
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/e2e-account-purge-dev.yml
      - scripts/e2e-account-purge.mjs

permissions:
  contents: read

# One proof at a time; a second run waits instead of cancelling a purge half-way.
concurrency:
  group: e2e-account-purge-dev
  cancel-in-progress: false

jobs:
  proof:
    name: account purge proof (kc-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Read by psql; never written to a file or a command line.
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KC_DEV_REF: enbqriuxvvuontiwslun
    steps:
      # Cron runs this workflow file from the default branch. The proof always runs dev's
      # script, because kc-dev runs dev's purge function.
      # fetch-tags: false avoids the D-195 tag-ruleset collision on `dev`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/dev
          fetch-tags: false
          persist-credentials: false

      - name: Guard – dev project only
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_REF" != "$KC_DEV_REF" ]; then
            echo "::error::supabase-dev SUPABASE_PROJECT_REF is not kc-dev; refusing."; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-supabase-cli

      # `supabase link` records the pooler address of the project (no password in it).
      - name: Link to kc-dev
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes >/dev/null

      # The two API keys are read from the Management API with the environment's access
      # token and masked at once. They reach the script through its environment, never as
      # an argument, and the script prints neither.
      - name: Run the proof
        run: |
          set -euo pipefail
          url="$(cat supabase/.temp/pooler-url)"
          case "$url" in postgres*://*) ;; *) echo "::error::no pooler address recorded by supabase link"; exit 1 ;; esac
          case "$url" in *"$KC_DEV_REF"*) ;; *) echo "::error::pooler address is not kc-dev's; refusing."; exit 1 ;; esac
          keys="$(supabase projects api-keys --project-ref "$KC_DEV_REF" -o json)"
          service="$(jq -r '[.[] | select(.name == "service_role" or .id == "service_role")][0].api_key // empty' <<<"$keys")"
          anon="$(jq -r '[.[] | select(.name == "anon" or .id == "anon")][0].api_key // empty' <<<"$keys")"
          if [ -z "$service" ] || [ -z "$anon" ]; then
            echo "::error::kc-dev did not return its anon and service_role keys"; exit 1
          fi
          echo "::add-mask::$service"
          echo "::add-mask::$anon"
          PURGE_PROOF_DB_URL="$url" SUPABASE_URL="https://${KC_DEV_REF}.supabase.co" \
            SUPABASE_ANON_KEY="$anon" SUPABASE_SERVICE_ROLE_KEY="$service" \
            node scripts/e2e-account-purge.mjs
