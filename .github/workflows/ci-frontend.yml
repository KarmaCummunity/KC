name: CI — frontend

# Frontend lane, called by ci.yml when app/** or a build input changed
# (scripts/ci-changes.mjs). checks and tests run in parallel; sonar starts as
# soon as tests finish:
#   • checks — typecheck, ESLint. The dependency audit covers every lockfile
#     in the static lane (scripts/check-dependency-audit.mjs, #1373).
#   • tests  — unit tests with coverage; the coverage artifact feeds the
#     SonarCloud scan (no second test run).
#   • sonar  — SonarCloud quality gate on the tests job's coverage.
# The web export and native bundles are the separate `bundles` lane
# (ci-bundles.yml), which PRs into dev leave to the merge queue.
# Jobs skip only on the `sonar` input (ci.yml's gate sees one lane result).

on:
  workflow_call:
    inputs:
      sonar:
        description: Run the SonarCloud quality gate (only PRs into main and main pushes; false for Dependabot).
        type: boolean
        required: true
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  tests:
    name: unit tests · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the brand guard's touched-file rule diffs against the PR base (spec 17 §6).
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-turbo

      - run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          overwrite: true
          retention-days: 3
          path: |
            app/packages/domain/coverage/
            app/packages/application/coverage/
            app/packages/infrastructure-supabase/coverage/
            app/packages/ui/coverage/
            app/apps/mobile/coverage/

  checks:
    name: typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-turbo

      - run: pnpm install --frozen-lockfile

      # ESLint only: the architecture, SSOT-link and Hebrew guards that
      # `pnpm lint` also chains run in the static-guards lane. Turbo runs each
      # package's typecheck before its lint, so typecheck runs once.
      - name: Typecheck + ESLint (per-package --max-warnings ratchet)
        run: pnpm exec turbo run typecheck lint

  sonar:
    name: sonar
    needs: tests
    if: inputs.sonar
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
