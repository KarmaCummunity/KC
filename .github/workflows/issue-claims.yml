name: Issue claims

# Releases agent claims (docs/agents/ISSUE_CLAIMS.md).
# Safe as pull_request_target: no PR code is checked out or run; the PR body
# is read via the API, never interpolated into the script.

# `push` to dev runs from dev's own workflow file; pull_request_target and
# schedule only run once this file is on main (TD-240).
on:
  push:
    branches: [dev]
  pull_request_target:
    branches: [dev]
    types: [closed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: issue-claims
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - name: Release claims
        run: |
          set -uo pipefail
          if [ -n "${PUSH_SHA:-}" ]; then
            PR_NUMBER=$(gh api "repos/$GH_REPO/commits/$PUSH_SHA/pulls" -q '[.[] | select(.merged_at != null)][0].number // empty')
            [ -z "$PR_NUMBER" ] && { echo "no merged PR for $PUSH_SHA"; exit 0; }
          fi
          release() {
            labels=$(gh issue view "$1" --json labels -q '[.labels[].name | select(. == "in-progress" or startswith("agent:"))] | join(",")')
            [ -n "$labels" ] && gh issue edit "$1" --remove-label "$labels" && echo "released #$1 ($2)"
            return 0
          }
          if [ -n "${PR_NUMBER:-}" ]; then
            { gh pr view "$PR_NUMBER" --json body -q .body \
              | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' \
              | grep -oE '[0-9]+$' | sort -u || true; } | while read -r n; do release "$n" merged; done
            exit 0
          fi
          cutoff=$(date -u -d '6 hours ago' +%s)
          gh issue list --label in-progress --state all --limit 200 --json number,state \
            -q '.[] | "\(.number) \(.state)"' | while read -r n state; do
            if [ "$state" = CLOSED ]; then release "$n" closed; continue; fi
            claimed=$(gh api "repos/$GH_REPO/issues/$n/events" --paginate \
              -q '[.[] | select(.event == "labeled" and .label.name == "in-progress")] | last | .created_at // empty' | tail -1)
            [ -z "$claimed" ] && continue
            [ "$(date -u -d "$claimed" +%s)" -gt "$cutoff" ] && continue
            prs=$(gh pr list --state open --search "$n in:body" --json number -q 'length')
            [ "$prs" = 0 ] && release "$n" stale
          done
