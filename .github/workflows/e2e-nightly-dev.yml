name: E2E nightly (dev)

# Full Playwright QA suite against https://dev.karma-community.pages.dev + kc-dev.
# Uses the e2e members of kc-dev (supabase/seed/e2e, loaded by the Seed KC dev workflow) and the publishable anon key
# read from the deployed bundle, so it needs no repository secrets. Never targets prod.
# mobile-nightly.yml calls it with `p0_only` to gate the store builds on the P0 journeys.
on:
  schedule:
    - cron: '0 1 * * *' # 04:00 Asia/Jerusalem (summer time)
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose tests/e2e suite runs (default refs/heads/dev, never main)
        type: string
        default: 'refs/heads/dev'
      suite:
        description: Full QA, request-only worker refusal, or focused media upload
        type: choice
        options:
          - full
          - worker-refusal
          - media-upload
          - media-readonly
        default: full
      media_post_id:
        description: Existing public DEV post UUID for the request-only diagnostic
        type: string
        default: ''
  workflow_call:
    inputs:
      p0_only:
        description: Run only the P0 journeys (tests/e2e/journeys/*.spec.ts), not the qa/ suite
        type: boolean
        default: false
      ref:
        description: Commit whose tests/e2e suite runs (default the caller's commit)
        type: string
        default: ''

# In a called run `github.workflow` is the caller's name, so the mobile nightly
# never shares (and never cancels) this workflow's own nightly group.
concurrency:
  group: e2e-nightly-dev-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: playwright (dev)
    runs-on: ubuntu-latest
    # 30 minutes of suite, plus up to 125 queued for a kc-dev test slot.
    timeout-minutes: 155
    permissions:
      contents: read
      actions: read # the kc-dev test slot reads which jobs are running
    env:
      DEV_WEB_URL: ${{ vars.DEV_WEB_URL || 'https://dev.karma-community.pages.dev' }}
    steps:
      - name: Restrict focused checks to DEV
        if: inputs.suite == 'worker-refusal' || inputs.suite == 'media-upload' || inputs.suite == 'media-readonly'
        env:
          TEST_REF: ${{ inputs.ref }}
        run: |
          test "$TEST_REF" = 'refs/heads/dev'
          # Pin both endpoints positively, not merely by production blacklist.
          echo 'DEV_WEB_URL=https://dev.karma-community.pages.dev' >> "$GITHUB_ENV"
          echo 'E2E_SUPABASE_URL=https://enbqriuxvvuontiwslun.supabase.co' >> "$GITHUB_ENV"

      # Cron runs this workflow file from the default branch, so an empty
      # `ref:` would check out main's tree against the dev Pages URL. Schedule
      # and a bare dispatch use refs/heads/dev. workflow_call keeps the
      # caller's SHA unless the caller passes ref (mobile-nightly does).
      # fetch-tags: false avoids the D-195 tag-ruleset collision on `dev`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || (github.event_name == 'workflow_call' && github.sha || 'refs/heads/dev') }}
          fetch-tags: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Wait for dev deployment
        run: node scripts/wait-for-url.mjs "${DEV_WEB_URL%/}/" 12 15000

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # kc-dev (Free/Nano) stalls when several suites hit it at once (13/14 Nov 2026), so at
      # most KC_DEV_TEST_SLOTS suites (default 2) run their tests against it together; the rest
      # queue here FIFO. API errors keep waiting; the bounded wait fails closed without a slot.
      - name: Wait for a kc-dev test slot
        timeout-minutes: 125
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KC_DEV_TEST_SLOTS: ${{ vars.KC_DEV_TEST_SLOTS }}
        # An older checked-out tree (e.g. mobile-nightly's pinned SHA) has no throttle yet.
        run: if [ -f scripts/kc-dev-slot.mjs ]; then node scripts/kc-dev-slot.mjs; else echo 'no kc-dev slot script in this tree'; fi

      - name: Run QA suite
        working-directory: tests/e2e
        env:
          P0_ONLY: ${{ inputs.p0_only }}
          TARGET_SUITE: ${{ inputs.suite || 'full' }}
          E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
          MEDIA_READONLY_POST_ID: ${{ inputs.media_post_id }}
        run: |
          # P0 = the top-level journeys plus the auth setup they depend on; the
          # pattern cannot cross a `/`, so journeys/qa/** is excluded.
          if [ "$TARGET_SUITE" = "worker-refusal" ]; then
            # Existing fixture signs in through Auth only. Normal sign-in creates a session. No browser auth setup,
            # content writes, account creation, seeding, or accepted service caller.
            npx playwright test journeys/worker-endpoints.spec.ts --project=journeys --no-deps
          elif [ "$TARGET_SUITE" = "media-upload" ]; then
            # No shared auth setup or broad cleanup; exact fixture uploads only, then remove them.
            npx playwright test journeys/media-upload-acceptance.spec.ts --project=journeys --no-deps
          elif [ "$TARGET_SUITE" = "media-readonly" ]; then
            # Normal Auth sign-in, then GET only. No shared setup, content writes or accepted worker.
            test -n "$MEDIA_READONLY_POST_ID"
            npx playwright test journeys/media-member-readonly.spec.ts --project=journeys --no-deps --retries=0
          elif [ "$P0_ONLY" = "true" ]; then
            npx playwright test 'journeys/[a-z-]+\.(setup|spec)\.ts'
          else
            npx playwright test
          fi

      - name: Summary
        if: always()
        working-directory: tests/e2e
        run: node scripts/summary.mjs

      # Raw browser reports can contain filled passwords, auth tokens and network payloads.
      # Keep failures red; publish only an allowlisted numeric summary, never raw attachments.
      - name: Prepare credential-safe Playwright counts
        id: safe-playwright-summary
        if: always()
        run: node scripts/playwright-safe-summary.mjs tests/e2e/test-results/results.json "$RUNNER_TEMP/safe-playwright-summary/counts.json"
      - name: Upload credential-safe Playwright counts only
        if: always() && steps['safe-playwright-summary'].outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-safe-counts
          path: ${{ runner.temp }}/safe-playwright-summary/counts.json
          if-no-files-found: error
          retention-days: 14
