name: CI — release

# Release lane, called by ci.yml for every PR (or merge group) into `main`
# (D-195, INFRA-CI-3). Replaces the separately required "CI — main release
# guard" and "CI — E2E dev" checks: the CI gate now fails a release whose
# lane did not succeed, so `main` needs only `CI gate`.
#
# Every job runs unconditionally (the gate sees one result for the lane, so an
# inner job that skipped on its own would pass unnoticed). A merge group has
# no head branch, so `source` fails it: main releases go through a PR.

on:
  workflow_call:
    secrets:
      E2E_SEED_PASSWORD:
        description: kc-dev seed users' password (the P0 journeys sign in with it)
        required: false

permissions:
  contents: read

jobs:
  source:
    name: release source is dev
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce dev → main
        env:
          # Branch names are attacker-controlled on fork PRs; never inline them.
          HEAD_REF: ${{ github.head_ref }}
          # A fork's branch can also be named dev; it must be this repo's dev.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Production releases must be a PR from this repository's \`dev\` into \`main\` (head: \`${HEAD_REPO:-none}:${HEAD_REF:-none}\`)."
            exit 1
          fi
          echo "Release source branch is $GITHUB_REPOSITORY:dev."

  # Stricter than the static lane's scan, for migrations this release adds or
  # changes: a destructive line needs its `migration-safety: allow` marker AND
  # a "Migration safety: <file> — <reason>" line in the PR body; a change that
  # can break the previous code (rename, type change, SET NOT NULL, dropped
  # function/policy, policy change, RLS off) needs that body line.
  migrations:
    name: release migration scan (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Scan the release's migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-migration-safety.mjs --release "$BASE_SHA" "$HEAD_SHA"

  # app/VERSION on the release head must be above the latest v* tag, or the
  # deploy's tag step would collide after prod is already updated.
  version:
    name: release version bump
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: VERSION above the latest release tag
        run: node scripts/release-version.mjs check-bump

  # P0 journeys against the live dev site (D-55), but only once dev serves the
  # exact release head: E2E against an older dev build would test the wrong
  # code. The dev deploy follows the dev push's CI run, so allow 30 minutes.
  e2e:
    name: dev E2E on the release head
    runs-on: ubuntu-latest
    # 60 minutes of wait-for-deploy + journeys, plus up to 125 queued for a kc-dev test slot.
    timeout-minutes: 185
    permissions:
      contents: read
      actions: read # the kc-dev test slot reads which jobs are running
    env:
      DEV_WEB_URL: ${{ vars.DEV_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Wait until dev serves the release head
        env:
          SMOKE_CHECKS: version
          SMOKE_WEB_URL: ${{ vars.DEV_WEB_URL }}
          SMOKE_SHA: ${{ github.event.pull_request.head.sha }}
          SMOKE_TIMEOUT_SECONDS: '1800'
          # dev deploys the `[skip ci]` version bump on top of the merge, and a [skip ci]
          # head never re-runs this PR's CI: accept that bump child as the release head.
          SMOKE_ACCEPT_VERSION_BUMP: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/smoke-deploy.mjs
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # kc-dev (Free/Nano) stalls when several suites hit it at once (13/14 Nov 2026), so at
      # most KC_DEV_TEST_SLOTS suites (default 2) run their tests against it together; the rest
      # queue here FIFO. Best effort: proceeds after 120 min or on any API error.
      - name: Wait for a kc-dev test slot
        timeout-minutes: 125
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KC_DEV_TEST_SLOTS: ${{ vars.KC_DEV_TEST_SLOTS }}
        # An older checked-out tree (e.g. mobile-nightly's pinned SHA) has no throttle yet.
        run: if [ -f scripts/kc-dev-slot.mjs ]; then node scripts/kc-dev-slot.mjs; else echo 'no kc-dev slot script in this tree'; fi

      - name: Run P0 journeys
        working-directory: tests/e2e
        env:
          E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
        run: npm test
      # Raw browser reports can contain filled passwords, auth tokens and network payloads.
      # Keep failures red; publish only an allowlisted numeric summary, never raw attachments.
      - name: Prepare credential-safe Playwright counts
        id: safe-playwright-summary
        if: always()
        run: node scripts/playwright-safe-summary.mjs tests/e2e/test-results/results.json "$RUNNER_TEMP/safe-playwright-summary/counts.json"
      - name: Upload credential-safe Playwright counts only
        if: always() && steps['safe-playwright-summary'].outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-safe-counts
          path: ${{ runner.temp }}/safe-playwright-summary/counts.json
          if-no-files-found: error
          retention-days: 14
