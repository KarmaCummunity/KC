# The composer opens with the unified create header (direction + category).
# Spec: docs/spec/requirements/04_posts.md FR-POST-001; docs/spec/07_cross_cutting_systems.md §7.2 (one form, D28).
appId: org.karmacommunity.app
name: Posts — composer opens
tags: [posts]
env:
  KC_NATIVE_CAPTURE_SAFE: "false"
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: tab-create
- extendedWaitUntil:
    visible:
      id: unified-create-header
    timeout: 15000
- assertVisible:
    id: create-post-screen

# Retained on success too; requires pixel inspection, not a visual verdict.
- runFlow:
    when:
      true: ${KC_NATIVE_CAPTURE_SAFE === 'true'}
    commands:
      - runFlow:
          when:
            visible:
              id: native-create-capture-safe
          commands:
            - takeScreenshot: 861-create-form
