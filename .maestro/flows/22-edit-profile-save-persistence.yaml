# Spec: FR-PROFILE-007 — edit profile save persists: changing the contact phone and tapping Save
# writes it to kc-dev, and reopening the screen shows the saved value. Flow 19 covers the
# keyboard/sticky-CTA layout only; it never edits a field or taps Save, and no other flow does.
#
# The phone is the fixture field (its only validation is 1-20 characters). The value TOGGLES
# between two fixtures (050-1234567 / 050-7654321): the flow reads the current value from the
# field, stores it and its opposite in Maestro output variables, asserts they differ, and writes
# the stored opposite — so every run is a real change and the controller's no-change fast path
# (router.back without a write) can never be taken. After leave/reopen the value is re-read from
# the SAME field with copyTextFrom and compared to the stored expectation with a strict-equality
# assertTrue (docs.maestro.dev/reference/commands-available/copytextfrom), not a screen-text
# search: only the phone input's own content can satisfy it. After the persistence assertion the
# flow RESTORES the run's starting value and saves again: the seed user is shared across every
# native run on kc-dev, and flow 19's capture-safe marker requires an empty contact phone, so
# leaving a fixture value saved breaks later runs (run 44995095437 polluted it to 050-7654321,
# and the next run's flow 19 failed its capture assert).
appId: org.karmacommunity.app
name: Profile — edit profile save persists
tags: [profile]
---
- runFlow: ../subflows/sign-in.yaml
- openLink: karmacommunity://edit-profile
- extendedWaitUntil:
    visible:
      id: edit-profile-save
    timeout: 20000
# The phone field sits below the avatar, name, city and street fields (as in flow 19).
- scrollUntilVisible:
    element:
      id: edit-profile-phone
    timeout: 15000
    centerElement: false
# Read the stored value from the field, then store it and its opposite fixture immediately, so no
# later step depends on the clipboard surviving navigation.
- copyTextFrom:
    id: edit-profile-phone
- evalScript: ${output.originalPhone = maestro.copiedText}
- evalScript: '${output.expectedPhone = output.originalPhone === "050-1234567" ? "050-7654321" : "050-1234567"}'
- assertTrue: ${output.originalPhone !== output.expectedPhone}
- tapOn:
    id: edit-profile-phone
- eraseText
- inputText: ${output.expectedPhone}
- hideKeyboard
# The save button sits at the bottom edge, above the floating tab bar once settled. Let the
# keyboard-hide layout settle before tapping: the assessed (unconfirmed) cause of run
# 45029689831's first attempt is a tap taken while the layout was still moving - the
# unsaved-changes guard opened and the retry passed unchanged.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: edit-profile-save
# A successful save navigates back to the feed; a failure stays on the form behind a NotifyModal.
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 30000
# Reopen: the form reloads the profile (getEditableProfile), so the same field must now hold the
# value this run wrote.
- openLink: karmacommunity://edit-profile
- extendedWaitUntil:
    visible:
      id: edit-profile-save
    timeout: 20000
- scrollUntilVisible:
    element:
      id: edit-profile-phone
    timeout: 15000
    centerElement: false
- copyTextFrom:
    id: edit-profile-phone
- evalScript: ${output.reopenedPhone = maestro.copiedText}
- assertTrue: ${output.reopenedPhone === output.expectedPhone}
# Restore the starting value (still on the reopened form). The field now holds expectedPhone,
# so writing originalPhone back is again a real change, never the no-change fast path; an empty
# original saves as null, which is the seeded state.
- tapOn:
    id: edit-profile-phone
- eraseText
- runFlow:
    when:
      true: ${output.originalPhone !== ""}
    commands:
      - inputText: ${output.originalPhone}
- hideKeyboard
# Same settle as above before the bottom-edge save tap.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: edit-profile-save
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 30000
