# The chat inbox opens from the top bar.
# Spec: docs/spec/requirements/07_chat.md (inbox).
appId: org.karmacommunity.app
name: Chat — inbox opens
tags: [chat, smoke]
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: topbar-chat
- extendedWaitUntil:
    visible:
      id: chat-inbox-screen
    timeout: 20000
# FR-CHAT-017 — the "+" opens the new-conversation picker.
- tapOn:
    id: chat-inbox-new
- extendedWaitUntil:
    visible:
      id: chat-new-screen
    timeout: 20000
