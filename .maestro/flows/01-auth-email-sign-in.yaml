# Sign in with email from a fresh install and land on the home feed.
# Spec: docs/spec/requirements/01_auth_and_onboarding.md FR-AUTH-001 AC2, FR-AUTH-002.
appId: org.karmacommunity.app
name: Auth — email sign-in reaches the feed
tags: [auth, smoke]
---
- runFlow: ../subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 90000
- assertVisible:
    id: shell-tab-bar
