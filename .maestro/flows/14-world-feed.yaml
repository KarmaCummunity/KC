# A giving world's own screen (food): the title menu of the world's screens opens from the TopBar, and the
# filter sheet is the main feed's one (search, sort, filters) with the world locked; the screen has no
# request / offer buttons, and the "+" tab opens the create form on the food world.
# Spec: docs/spec/requirements/06_feed_and_search.md FR-FEED-020 AC2 / AC4; docs/spec/07_cross_cutting_systems.md §7.3.
appId: org.karmacommunity.app
name: Worlds — food world feed and the "+" entry
tags: [donations, feed]
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: tab-donations
- extendedWaitUntil:
    visible:
      id: donations-hub
    timeout: 15000
- scrollUntilVisible:
    element:
      id: donation-tile-food
    direction: DOWN
    timeout: 10000
- tapOn:
    id: donation-tile-food
- extendedWaitUntil:
    visible:
      id: world-feed-filter-button
    timeout: 15000
- tapOn:
    id: world-screens-menu-toggle
- assertVisible:
    id: world-menu-feed
- tapOn:
    id: world-menu-feed
- tapOn:
    id: world-feed-filter-button
- assertVisible:
    id: filters-type
- assertNotVisible:
    id: filters-worlds
- pressKey: back
- tapOn:
    id: tab-create
- extendedWaitUntil:
    visible:
      id: listing-create-form
    timeout: 15000
- assertVisible:
    id: unified-create-header
