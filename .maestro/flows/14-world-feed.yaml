# A giving world's own screen (food): search within the world and the offers / requests filter
# render on device; the screen has no request / offer buttons, and the "+" tab opens the create
# form on the food world.
# Spec: docs/spec/requirements/06_feed_and_search.md FR-FEED-020 AC2 / AC4; docs/spec/07_cross_cutting_systems.md §7.3.
appId: org.karmacommunity.app
name: Worlds — food world feed and the "+" entry
tags: [donations, feed]
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: tab-donations
- extendedWaitUntil:
    visible:
      id: donations-hub
    timeout: 15000
- scrollUntilVisible:
    element:
      id: donation-tile-food
    direction: DOWN
    timeout: 10000
- tapOn:
    id: donation-tile-food
- extendedWaitUntil:
    visible:
      id: world-feed-search
    timeout: 15000
- tapOn:
    id: world-feed-direction-request
- assertVisible:
    id: world-feed-direction-all
- tapOn:
    id: tab-create
- extendedWaitUntil:
    visible:
      id: listing-create-form
    timeout: 15000
- assertVisible:
    id: unified-create-header
