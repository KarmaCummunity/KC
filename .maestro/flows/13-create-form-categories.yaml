# Native regression for the create-form crash: open every category in both directions and
# open the date sheet of the food offer, so a native picker or slider that crashes the app
# (TestFlight, 1.6.x) fails here instead of in the store build.
# Category chips scroll horizontally; use testIDs so Maestro does not depend on them being on screen.
# The category row sits at the top of the form, and a failed publish scrolls the form down to the
# first problem field (FR-POST-001 AC6), so every category lookup scrolls UP to reach the row again.
# Spec: docs/spec/requirements/04_posts.md FR-POST-001 AC6; docs/spec/07_cross_cutting_systems.md §7.2.
appId: org.karmacommunity.app
name: Posts — create form categories open on device
tags: [posts]
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: tab-create
- extendedWaitUntil:
    visible:
      id: unified-create-header
    timeout: 15000
- scrollUntilVisible:
    element:
      id: create-category-rides
    timeout: 10000
- tapOn:
    id: create-category-rides
- tapOn: "להציע"
- extendedWaitUntil:
    visible:
      id: ride-departs-at
    timeout: 10000
- tapOn:
    id: create-header-publish
- assertVisible:
    id: listing-create-form
- tapOn: "לבקש"
- assertVisible:
    id: ride-departs-at
- scrollUntilVisible:
    element:
      id: create-category-food
    timeout: 10000
    direction: UP
- tapOn:
    id: create-category-food
- tapOn: "להציע"
# The expiry field sits below the photos, title and city, so scroll down to it.
- scrollUntilVisible:
    element: "תאריך תפוגה"
    timeout: 15000
- tapOn: "בחירת תאריך ושעה"
# Android opens the system date dialog; iOS opens the app's bottom sheet.
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "ביטול"
# The category row also scrolls sideways and centers the chosen chip, so visit the chips in row
# order (food, time, housing, items) and swipe the row itself until the next chip is on screen. The
# swipe direction depends on RTL, so each search tries one direction, then the other.
- scrollUntilVisible:
    element:
      id: create-category-time
    timeout: 10000
    direction: UP
- tapOn:
    id: create-category-time
- assertVisible:
    id: listing-create-form
- runFlow:
    file: ../subflows/reveal-create-category.yaml
    env:
      CATEGORY: housing
- tapOn:
    id: create-category-housing
- assertVisible:
    id: listing-create-form
- runFlow:
    file: ../subflows/reveal-create-category.yaml
    env:
      CATEGORY: items
- tapOn:
    id: create-category-items
- assertVisible:
    id: create-post-screen
