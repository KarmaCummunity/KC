# Native regression for the create-form crash: open every category in both directions and
# open the date sheet of the food offer, so a native picker or slider that crashes the app
# (TestFlight, 1.6.x) fails here instead of in the store build.
# Category chips scroll horizontally; use testIDs so Maestro does not depend on them being on screen.
# Spec: docs/spec/requirements/04_posts.md FR-POST-001 AC6; docs/spec/07_cross_cutting_systems.md §7.2.
appId: org.karmacommunity.app
name: Posts — create form categories open on device
tags: [posts]
---
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: tab-create
- extendedWaitUntil:
    visible:
      id: unified-create-header
    timeout: 15000
- scrollUntilVisible:
    element:
      id: create-category-rides
    timeout: 10000
- tapOn:
    id: create-category-rides
- tapOn: "להציע"
- extendedWaitUntil:
    visible:
      id: ride-departs-at
    timeout: 10000
- tapOn:
    id: create-header-publish
- assertVisible:
    id: listing-create-form
- tapOn: "לבקש"
- assertVisible:
    id: ride-departs-at
- scrollUntilVisible:
    element:
      id: create-category-food
    timeout: 10000
- tapOn:
    id: create-category-food
- tapOn: "להציע"
- extendedWaitUntil:
    visible: "תאריך תפוגה"
    timeout: 10000
- tapOn: "בחירת תאריך ושעה"
# Android opens the system date dialog; iOS opens the app's bottom sheet.
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "ביטול"
- scrollUntilVisible:
    element:
      id: create-category-housing
    timeout: 10000
- tapOn:
    id: create-category-housing
- assertVisible:
    id: listing-create-form
- scrollUntilVisible:
    element:
      id: create-category-time
    timeout: 10000
- tapOn:
    id: create-category-time
- assertVisible:
    id: listing-create-form
- scrollUntilVisible:
    element:
      id: create-category-items
    timeout: 10000
- tapOn:
    id: create-category-items
- assertVisible:
    id: create-post-screen
